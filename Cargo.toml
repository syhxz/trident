[package]
name = "trident"
version = "0.1.0"
edition = "2021"
description = "PostgreSQL 智能读写分离代理"

[lib]
name = "trident"
path = "src/lib.rs"

[[bin]]
name = "trident"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
logroller = "0.1"
thiserror = "1"
async-trait = "0.1"
axum = { version = "0.7", features = ["ws"] }
serde_json = "1"
metrics = "0.23"
metrics-exporter-prometheus = { version = "0.15", default-features = false }
arc-swap = "1.7"
rust-embed = "8"
mime_guess = "2"
base64 = "=0.22.1"
hmac = "=0.12.1"
md-5 = "=0.10.6"
pbkdf2 = "=0.12.2"
rand = "=0.9.5"
sha2 = "=0.10.9"
stringprep = "=0.1.5"
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
rustls-pemfile = "2"
rustls-native-certs = "0.8"
parking_lot = "0.12"
subtle = "2"
getrandom = "0.2"

[dev-dependencies]
proptest = "1"
testcontainers = "0.15"
tower = { version = "0.5", features = ["util"] }
