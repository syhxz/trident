# NOTE: this example keeps the *entire* config file (including the
# non-sensitive routing/pool/health settings) in a single Secret, for
# simplicity. Trident now supports keeping passwords out of the config
# file entirely (see DEPLOYMENT.md section 2): use a "${ENV_VAR}" placeholder
# in the `password` field and inject the real value via a separate,
# smaller Secret mounted as an env var, then split this file into a
# ConfigMap (routing/pool/health/logging/proxy, non-sensitive) plus that
# small password-only Secret. This example does not do that split yet,
# to keep the manifest set minimal; either approach is valid.
#
# Do NOT commit a real password into this file as checked into version
# control. Generate it at deploy time instead, e.g.:
#   kubectl create secret generic trident-config \
#     --namespace trident \
#     --from-file=config.yaml=./config.yaml \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: trident-config
  namespace: trident
type: Opaque
stringData:
  config.yaml: |
    proxy:
      listen_addr: "0.0.0.0:6432"
      max_clients: 2000

    # `admin.listen_addr` must bind 0.0.0.0 (not 127.0.0.1) here: the
    # kubelet's httpGet readiness probe (see 20-deployment.yaml) connects
    # to the Pod's IP from outside the container's network namespace, not
    # from "localhost" inside it. No Service exposes this port outside the
    # pod network, so it remains unreachable from outside the cluster.
    admin:
      enabled: true
      listen_addr: "0.0.0.0:9090"

    nodes:
      - name: primary
        host: postgres-writer.default.svc.cluster.local
        port: 5432
        type: writer
        weight: 1
        database: mydb
        username: proxy_user
        password: "REPLACE_ME"

      - name: reader-1
        host: postgres-reader.default.svc.cluster.local
        port: 5432
        type: reader
        weight: 1
        database: mydb
        username: proxy_user
        password: "REPLACE_ME"

    routing:
      default_consistency: session
      load_balance_strategy: weighted_round_robin
      enable_transaction_split: true
      split_respects_consistency: true
      enable_hint_routing: true
      enable_cost_routing: true
      cost_threshold: 50000
      analytics_patterns: []
      writer_readable: true
      max_replication_lag_ms: 1000

    pool:
      mode: transaction
      max_pool_size: 50
      min_pool_size: 5
      max_idle_time: 5m
      connection_timeout: 5s
      max_lifetime: 30m

    health:
      check_interval: 3s
      check_timeout: 2s
      max_retries: 3

    logging:
      level: info
      query_log: false
      slow_query: 1000
